api:
  base: "https://users.roblox.com/v1"
  friends: "https://friends.roblox.com/v1"
  groups: "https://groups.roblox.com/v1"
  badges: "https://badges.roblox.com/v1"
  thumbnails: "https://thumbnails.roblox.com/v1"
  inventory: "https://inventory.roblox.com/v1"
  economy: "https://economy.roblox.com/v1"
  trades: "https://trades.roblox.com/v1"
  games: "https://games.roblox.com/v1"
rate_limit:
  requests_per_second: 5
  timeout: 10
  retry: 3
  retry_delay: 2
output:
  dir: "data/output"
  cache_dir: "data/cache"
  log_dir: "logs"
  format: "json"
analysis:
  friends_depth: 2
  red_flag_threshold: 3
  laundering_score_threshold: 70
red_flags:
  keywords:
    - "barbar"
    - "anonymous"
    - "syndicate"
    - "bunker"
    - "mule"
    - "launder"
    - "dark"
    - "blackmarket"
    - "oknum"
    - "garuda"
    - "rahasia"
    - "gelap"
oknum_db:
  path: "data/oknum_db.json"
  match_threshold: 0.8
